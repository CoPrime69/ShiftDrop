name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # "Run workflow" on the Actions page; with "bench" ticked it also runs the speed benchmark.
  workflow_dispatch:
    inputs:
      bench:
        description: Run the speed benchmark (tests/BenchTests.cpp) and add its table to the summary
        type: boolean
        default: true

permissions:
  contents: write   # only the tag-triggered "Publish release" step writes (it creates the release)

jobs:
  # ShiftDrop's own small LGPL ffmpeg.exe (scripts/build-ffmpeg.sh): only the codecs, formats and
  # filters the app uses (scripts/ffmpeg-components.txt), cross-compiled with MinGW-w64. Cached on the
  # script and the list, so it is only rebuilt when one of them changes. Setting the repository
  # variable SHIFTDROP_FFMPEG to "btbn" skips it, and the build job ships the pinned BtbN build.
  ffmpeg:
    if: vars.SHIFTDROP_FFMPEG != 'btbn'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: cache
        with:
          path: build/ffmpeg-custom
          key: ffmpeg-custom-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/ffmpeg-components.txt') }}

      - name: Install MinGW-w64
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mingw-w64 nasm meson ninja-build cmake pkg-config autoconf automake libtool xz-utils

      - name: Build ffmpeg.exe
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh build/ffmpeg-work build/ffmpeg-custom

      - name: Configure options
        run: cat build/ffmpeg-custom/FFMPEG-SOURCE.txt && ls -l build/ffmpeg-custom

      # The build job takes ffmpeg.exe from here; the source tarball goes into a release.
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-custom-${{ github.sha }}
          path: build/ffmpeg-custom
          if-no-files-found: error

  build:
    needs: ffmpeg
    # Also when the ffmpeg job was skipped (SHIFTDROP_FFMPEG=btbn): get-ffmpeg.ps1 then falls back.
    if: ${{ !cancelled() && needs.ffmpeg.result != 'failure' }}
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite
      # The "ci" preset (Ninja, build/ci) compiles through sccache, which keeps every object file in
      # the GitHub Actions cache: a push that changes a few files recompiles only those.
      SCCACHE_GHA_ENABLED: 'true'
      # The timing steps (photo tools, our ffmpeg vs BtbN) print numbers for a person to read, so
      # they run on tags, manual runs and pull requests labelled "bench", not on every push.
      SD_TIMINGS: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.pull_request.labels.*.name, 'bench') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.18.0

      # The installed vcpkg ports (build/vcpkg_installed), keyed on the manifest, the triplet and the
      # compiler. On a hit, Configure skips vcpkg entirely.
      - uses: actions/cache@v4
        id: vcpkg-installed
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-${{ env.VCToolsVersion }}-${{ hashFiles('vcpkg.json', 'triplets/**') }}

      # Otherwise vcpkg installs them from its built packages, cached between runs, keyed on the manifest.
      - uses: actions/cache@v4
        if: steps.vcpkg-installed.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-

      # The pinned ffmpeg zip (scripts/get-ffmpeg.ps1) is 170 MB: download it once, keyed on the script
      # that pins its URL and hash. Only needed without our own build, or to time the two.
      - uses: actions/cache@v4
        if: needs.ffmpeg.result != 'success' || env.SD_TIMINGS == 'true'
        with:
          path: build/downloads
          key: ffmpeg-${{ hashFiles('scripts/get-ffmpeg.ps1') }}

      - uses: actions/download-artifact@v4
        if: needs.ffmpeg.result == 'success'
        with:
          name: ffmpeg-custom-${{ github.sha }}
          path: build/ffmpeg-custom

      # Before Configure: CMake copies engines/ffmpeg.exe next to the exe and gives it to the tests.
      # Our own build when the ffmpeg job made one, else the pinned BtbN build.
      - name: Get ffmpeg
        shell: pwsh
        run: ./scripts/get-ffmpeg.ps1

      # Everything the app's argument builders use (tests/FfmpegComponentsTests.cpp checks the list
      # against them) must be in the exe.
      - name: Check ffmpeg components
        shell: pwsh
        run: ./scripts/check-ffmpeg.ps1 -Exe build/engines/ffmpeg.exe

      - name: Configure
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          if ('${{ steps.vcpkg-installed.outputs.cache-hit }}' -eq 'true') {
            cmake --preset ci -DVCPKG_MANIFEST_INSTALL=OFF
          } else {
            New-Item -ItemType Directory -Force "${{ github.workspace }}\vcpkg-cache" | Out-Null
            # The runner's vcpkg clone can be older than our builtin-baseline commit; fetch so it resolves.
            git -C $env:VCPKG_ROOT fetch --quiet origin
            cmake --preset ci
          }
          if ($LASTEXITCODE) { exit 1 }

      - name: Build
        run: cmake --build --preset ci

      # In parallel (the test preset sets the job count): each test runs in its own process, with its
      # own temporary folder (tests/TestUtil.h names it after the process).
      - name: Unit tests
        run: ctest --preset ci

      - name: Offline check (no networking imports)
        shell: pwsh
        run: |
          ./scripts/check-imports.ps1 -Exe build/ci/ShiftDrop.exe
          ./scripts/check-imports.ps1 -Exe build/ci/ShiftDropWorker.exe

      # Inno Setup ships on the windows-2022 image; install it only if a future image drops it.
      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path src/Brand.h -Pattern '#define SD_VERSION L"([^"]+)"').Matches[0].Groups[1].Value
          ./scripts/make-notices.ps1 -Installed build/vcpkg_installed/x64-windows-static
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; if ($LASTEXITCODE) { exit 1 } }
          & $iscc /Qp "/DAppVersion=$version" "/DAppExe=..\build\ci\ShiftDrop.exe" "/DWorkerExe=..\build\ci\ShiftDropWorker.exe" installer/ShiftDrop.iss
          if ($LASTEXITCODE) { exit 1 }
          $setup = Get-Item "build/installer/ShiftDrop-Setup-$version.exe"
          $lines = @("### Installer: $([math]::Round($setup.Length / 1MB, 1)) MB", '', '| Packaged file | MB |', '|---|---:|')
          foreach ($f in @(Get-Item build/ci/ShiftDrop.exe, build/ci/ShiftDropWorker.exe) + @(Get-ChildItem build/engines -File)) {
            $lines += "| $($f.Name) | $([math]::Round($f.Length / 1MB, 2)) |"
          }
          $lines | ForEach-Object { Write-Host $_ }
          $lines | Add-Content $env:GITHUB_STEP_SUMMARY
          "SD_VERSION=$version" >> $env:GITHUB_ENV
          "SD_SETUP=build/installer/ShiftDrop-Setup-$version.exe" >> $env:GITHUB_ENV

      - name: Installer smoke test
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Setup $env:SD_SETUP

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-logs-${{ github.sha }}
          path: ${{ runner.temp }}/installer-logs
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ShiftDrop-Setup-${{ github.sha }}
          path: ${{ env.SD_SETUP }}

      - uses: actions/upload-artifact@v4
        with:
          name: ShiftDrop-${{ github.sha }}
          path: build/ci/ShiftDrop.exe

      # The speed benchmark (Bench.*, skipped in the unit tests above) only runs when asked: "Run
      # workflow" with "bench" ticked, or a pull request labelled "bench". Its table goes into the
      # run's summary page.
      - name: Speed benchmark
        if: (github.event_name == 'workflow_dispatch' && inputs.bench) || contains(github.event.pull_request.labels.*.name, 'bench')
        shell: pwsh
        run: |
          $env:SHIFTDROP_BENCH = '1'
          $env:SHIFTDROP_FFMPEG = (Resolve-Path build/engines/ffmpeg.exe).Path
          $env:SHIFTDROP_BENCH_OUT = $env:GITHUB_STEP_SUMMARY
          build/ci/shiftdrop_tests.exe --gtest_filter=Bench.*
          if ($LASTEXITCODE) { exit 1 }

      # The photo tools' export times for a 12 MP photo, printed for the log (the runner has no GPU,
      # so this is WARP: a floor, not what a PC with a graphics card gets). The unit tests run the
      # same test on every push; this prints its numbers.
      - name: Photo timings
        if: env.SD_TIMINGS == 'true'
        run: build\ci\shiftdrop_tests.exe --gtest_filter=PhotoTiming.*

      # Our ffmpeg.exe against the full BtbN build it replaces, with the app's own arguments.
      - name: ffmpeg timing (ours vs BtbN)
        if: env.SD_TIMINGS == 'true' && needs.ffmpeg.result == 'success'
        shell: pwsh
        run: |
          ./scripts/get-ffmpeg.ps1 -Btbn -Out build/engines-btbn
          ./scripts/time-ffmpeg.ps1 -New build/engines/ffmpeg.exe -NewName ours -Old build/engines-btbn/ffmpeg.exe -OldName BtbN

      # A version tag (v0.2.0) publishes the installer as a GitHub Release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref_name }}" -ne "v$env:SD_VERSION") { throw "Tag ${{ github.ref_name }} does not match SD_VERSION $env:SD_VERSION in src/Brand.h" }
          # The complete source of our ffmpeg.exe goes next to the installer (LGPL; FFMPEG-SOURCE.txt points here).
          $files = @($env:SD_SETUP)
          if (Test-Path build/ffmpeg-custom/ffmpeg-sources.tar.xz) {
            Copy-Item build/ffmpeg-custom/ffmpeg-sources.tar.xz "build/installer/ShiftDrop-$env:SD_VERSION-ffmpeg-sources.tar.xz"
            $files += "build/installer/ShiftDrop-$env:SD_VERSION-ffmpeg-sources.tar.xz"
          }
          gh release create "${{ github.ref_name }}" @files --title "ShiftDrop $env:SD_VERSION" --notes "Download ShiftDrop-Setup-$env:SD_VERSION.exe and run it. No admin rights or Visual Studio needed."

  # The placeholder gesture build (SHIFTDROP_M0, see CMakePresets.json's x64-release-m0) only changes
  # the app's own sources, so it builds the app target alone, beside the main build rather than after
  # it. It shares the main build's compiler cache: the libraries come out of it unchanged.
  placeholder:
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,read
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.18.0

      - uses: actions/cache/restore@v4
        id: vcpkg-installed
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-${{ env.VCToolsVersion }}-${{ hashFiles('vcpkg.json', 'triplets/**') }}

      - uses: actions/cache/restore@v4
        if: steps.vcpkg-installed.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-

      - name: Configure
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          if ('${{ steps.vcpkg-installed.outputs.cache-hit }}' -eq 'true') {
            cmake --preset ci -DSHIFTDROP_M0=ON -DSHIFTDROP_TESTS=OFF -DVCPKG_MANIFEST_INSTALL=OFF
          } else {
            New-Item -ItemType Directory -Force "${{ github.workspace }}\vcpkg-cache" | Out-Null
            git -C $env:VCPKG_ROOT fetch --quiet origin
            cmake --preset ci -DSHIFTDROP_M0=ON -DSHIFTDROP_TESTS=OFF
          }
          if ($LASTEXITCODE) { exit 1 }

      - name: Build the placeholder gesture build
        run: cmake --build --preset ci --target ShiftDrop
