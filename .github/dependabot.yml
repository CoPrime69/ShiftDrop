# Keeps the GitHub Actions used by CI up to date. vcpkg ports are pinned by the baseline in
# vcpkg.json and are updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Don't rebase an open update after every merge to main: each rebase reruns CI and emails the owner.
    rebase-strategy: disabled
    groups:
      actions:
        patterns: ["*"]
